# Spoty T9 (Windows, Go): тесты движка + сборка exe в артефакт.
name: T9 (Windows)

on:
  push:
    branches: ['**']
    paths:
      - 't9/**'
      - '.github/workflows/t9.yml'
  pull_request:
    paths:
      - 't9/**'
      - '.github/workflows/t9.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: t9/go.mod

      - name: Test (движок)
        working-directory: t9
        run: go test -v ./...

      - name: Build
        working-directory: t9
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o dist\spoty-t9.exe .

      - name: Smoke test (версия)
        working-directory: t9
        run: .\dist\spoty-t9.exe --version

      # Реальный запуск приложения (без self-install): трей, хоткей, хук.
      # Ловит паники при старте, которых не видно в --version.
      # При сбое пишет ::error-аннотацию с состоянием процесса и логом.
      - name: Smoke test (запуск с треем и хуком)
        working-directory: t9
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:LOCALAPPDATA "SpotyT9\spoty-t9.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = $null
          function Fail([string]$msg) {
            $state = "p=null"
            if ($null -ne $p) { $state = "pid=$($p.Id) exited=$($p.HasExited) code=$($p.ExitCode)" }
            $tail = ""
            if (Test-Path $log) {
              $tail = " | ЛОГ: " + ((Get-Content $log -Raw) -replace "`r?`n", " | ")
            }
            Write-Host "::error file=.github/workflows/t9.yml,line=27::SMOKE-FAIL $msg | $state$tail"
            exit 1
          }
          try {
            $p = Start-Process -FilePath ".\dist\spoty-t9.exe" -ArgumentList "--reexec" -PassThru
            Start-Sleep -Seconds 6
            if ($p.HasExited) { Fail "процесс завершился досрочно" }
            if (-not (Test-Path $log)) { Fail "лог не создан" }
            $content = Get-Content $log -Raw
            Write-Host $content
            if ($content -notmatch "хук клавиатуры установлен") { Fail "нет установки хука" }
            if ($content -notmatch "трей-иконка добавлена") { Fail "нет трей-иконки" }
            Write-Host "SMOKE OK: трей и хук работают"
          } finally {
            if ($null -ne $p) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoty-t9-windows-amd64
          path: t9/dist/spoty-t9.exe
          if-no-files-found: error
