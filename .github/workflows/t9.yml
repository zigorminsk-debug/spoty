# Spoty T9 (Windows, Go): тесты движка + сборка exe в артефакт.
name: T9 (Windows)

on:
  push:
    branches: ['**']
    paths:
      - 't9/**'
      - '.github/workflows/t9.yml'
  pull_request:
    paths:
      - 't9/**'
      - '.github/workflows/t9.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: t9/go.mod

      - name: Test (движок)
        working-directory: t9
        run: go test -v ./...

      - name: Build
        working-directory: t9
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o dist\spoty-t9.exe .

      - name: Smoke test (версия)
        working-directory: t9
        run: .\dist\spoty-t9.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoty-t9-windows-amd64
          path: t9/dist/spoty-t9.exe
          if-no-files-found: error
