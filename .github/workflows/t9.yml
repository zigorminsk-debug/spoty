# Spoty T9 (Windows, Go): тесты движка + сборка exe в артефакт.
name: T9 (Windows)

on:
  push:
    branches: ['**']
    paths:
      - 't9/**'
      - '.github/workflows/t9.yml'
  pull_request:
    paths:
      - 't9/**'
      - '.github/workflows/t9.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: t9/go.mod

      - name: Test (движок)
        working-directory: t9
        run: go test -v ./...

      - name: Build
        working-directory: t9
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o dist\spoty-t9.exe .

      - name: Smoke test (версия)
        working-directory: t9
        run: .\dist\spoty-t9.exe --version

      # Реальный запуск приложения (без self-install): трей, хоткей, хук.
      # Ловит паники при старте, которых не видно в --version.
      - name: Smoke test (запуск с треем и хуком)
        working-directory: t9
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:LOCALAPPDATA "SpotyT9\spoty-t9.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath ".\dist\spoty-t9.exe" -ArgumentList "--reexec" -PassThru
          try {
            Start-Sleep -Seconds 6
            if ($p.HasExited) {
              if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host "LOG: $_" } }
              throw "процесс завершился досрочно (код $($p.ExitCode)) — паника при старте"
            }
            if (-not (Test-Path $log)) { throw "процесс жив, но лог не создан: $log" }
            $content = Get-Content $log -Raw
            Write-Host $content
            if ($content -notmatch "хук клавиатуры установлен") { throw "в логе нет установки хука" }
            if ($content -notmatch "трей-иконка добавлена") { throw "в логе нет добавления трей-иконки" }
            Write-Host "SMOKE OK: трей и хук работают"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoty-t9-windows-amd64
          path: t9/dist/spoty-t9.exe
          if-no-files-found: error
